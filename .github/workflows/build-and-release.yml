name: Build and release MODs

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'editor/src/main/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'editor/*.gradle'
      - 'editor/gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/scripts/**'
      - '.github/workflows/build-and-release.yml'
  pull_request:
    branches: [master]
    paths:
      - 'src/**'
      - 'editor/src/main/**'
      - '*.gradle'
      - 'gradle.properties'
      - 'editor/*.gradle'
      - 'editor/gradle.properties'
      - 'gradle/**'
      - 'gradlew*'
      - '.github/scripts/**'
      - '.github/workflows/build-and-release.yml'
  # Manual runs build only. Re-run a failed push run to retry its release.
  workflow_dispatch:

permissions:
  contents: read

# Supersede old PR builds, but never cancel a version-changing push with a later push.
concurrency:
  group: mods-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build both JARs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      release: ${{ steps.metadata.outputs.release }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout the triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read versions and detect a release
        id: metadata
        run: python3 .github/scripts/release.py metadata
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle and validate its wrapper
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.event_name != 'push' }}
      # Test sources intentionally remain local/ignored; do not claim this runs those tests.
      - name: Assemble main MOD and Editor
        run: bash ./gradlew --no-daemon --stacktrace :assemble :editor:assemble
      - name: Verify and package the two JARs
        run: python3 .github/scripts/release.py package
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maimai-dialogue-${{ github.sha }}
          path: build/release/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the paired release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.build.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.build.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Checkout the same commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download this run's verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: maimai-dialogue-${{ github.sha }}
          path: build/release/
      - name: Create tag, upload both JARs, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish
