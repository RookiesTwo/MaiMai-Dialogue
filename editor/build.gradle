plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'IzzelAliz Maven'
        url = 'https://maven.izzel.io/releases/'
    }
}

neoForge {
    version = project.neo_version

    // 编辑器保留独立 MOD 定义，开发启动统一由根项目 Client 管理。
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

apply from: rootProject.file('gradle/modernui.gradle')

dependencies {
    // 只建立编译／运行依赖，不将主 MOD 嵌入编辑器 JAR。
    implementation project(':')
    // Pure project storage/history tests; no UI/layout tests or Minecraft test bootstrap.
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    // Same Gson version as Minecraft 1.21.1, exposed explicitly to the plain JVM tests.
    testImplementation 'com.google.code.gson:gson:2.10.1'
    // Namespace suggestions reuse ICU already shipped by Minecraft 1.21.1.
    testImplementation 'com.ibm.icu:icu4j:73.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

// 编辑器元数据独立生成；当前预览接口尚未稳定，运行时精确匹配主 MOD 版本。
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            main_mod_id            : rootProject.mod_id,
            main_mod_version       : rootProject.mod_version,
            modernui_mc_version    : modernui_mc_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
