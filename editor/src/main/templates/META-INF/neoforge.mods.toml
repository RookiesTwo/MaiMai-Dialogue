modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "${main_mod_id}"
type = "required"
versionRange = "[${main_mod_version}]"
ordering = "AFTER"
side = "CLIENT"

[[dependencies."${mod_id}"]]
modId = "modernui"
type = "required"
versionRange = "[${modernui_mc_version},)"
ordering = "AFTER"
side = "CLIENT"
